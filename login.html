<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#e02431" />
  <title>ログイン — Orchestra</title>
  <meta name="description" content="Orchestra アカウントにログイン、または新規登録します。" />

  <link rel="icon" type="image/png" href="./assets/orchestra-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="auth-body">
  <main class="auth-layout">
    <section class="auth-panel">
      <a class="brand auth-brand" href="./index.html" aria-label="Orchestra ホームへ戻る">
        <img class="brand-mark" src="./assets/orchestra-logo.png" alt="" aria-hidden="true" />
        <span>Orchestra</span>
      </a>

      <div class="auth-card">
        <div class="auth-tabs" role="tablist" aria-label="ログインまたは新規登録">
          <button class="auth-tab is-active" id="tabLogin" role="tab" aria-selected="true" aria-controls="authForm" type="button">ログイン</button>
          <button class="auth-tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="authForm" type="button">新規登録</button>
        </div>

        <h1 class="auth-title" id="authTitle">おかえりなさい。</h1>
        <p class="auth-sub" id="authSub">Orchestra アカウントにログインしてください。</p>

        <div class="auth-alert" id="authAlert" role="alert" hidden></div>

        <form id="authForm" novalidate>
          <div class="field" id="nameField" hidden>
            <label for="name">お名前</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="山田 太郎" />
            <p class="field-error" id="nameError" hidden>お名前を入力してください。</p>
          </div>

          <div class="field">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            <p class="field-error" id="emailError" hidden>正しいメールアドレスを入力してください。</p>
          </div>

          <div class="field">
            <label for="password">パスワード</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="8文字以上" minlength="8" required />
              <button class="password-toggle" id="passwordToggle" type="button" aria-label="パスワードを表示" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="field-error" id="passwordError" hidden>パスワードは8文字以上で入力してください。</p>
          </div>

          <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">ログイン</button>
        </form>

        <p class="auth-note">
          続行することで、<a href="./LICENSE.txt">利用規約</a>に同意したものとみなされます。
          アカウント情報はこの端末内(ローカル)にのみ保存されます。
        </p>
      </div>

      <p class="auth-footer">
        <a href="./index.html">← トップページに戻る</a>
      </p>
    </section>

    <aside class="auth-visual" aria-hidden="true">
      <img class="auth-logo" src="./assets/orchestra-logo.png" alt="" />
      <blockquote>
        <p>ひとつの指示で、AI の楽団が動き出す。</p>
        <footer>Orchestra — 次世代 AI IDE</footer>
      </blockquote>
    </aside>
  </main>

  <script src="./auth.js" defer></script>
  <script src="./login.js" defer></script>
</body>
</html>
