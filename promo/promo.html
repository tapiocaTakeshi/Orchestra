<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Orchestra Promo</title>
<!-- Subsetted Inter / Noto Sans JP (SIL OFL), bundled so rendering works offline. Rebuild with promo/fonts.py -->
<link href="fonts.css" rel="stylesheet">
<style>
  :root {
    --red: #e02431;
    --red-hi: #ff4d5a;
    --pink: #ffd3d7;
    --blush: #fff0f1;
    --ink: #141416;
    --muted: #8b8b93;
    --grey: #ececef;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  body { font-family: "Inter", "Noto Sans JP", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .jp { font-family: "Noto Sans JP", "Inter", sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #fff; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .abs { position: absolute; }
  .ch, .w { display: inline-block; white-space: pre; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
  .cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.25)); }
  .dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
    background: var(--red); box-shadow: 0 0 0 6px rgba(224,36,49,.18), 0 0 24px rgba(224,36,49,.6); }

  /* ---------- S1 floating windows ---------- */
  #s1 { background: radial-gradient(ellipse 60% 70% at 18% 20%, #ffd0d4 0%, rgba(255,208,212,0) 70%),
                    radial-gradient(ellipse 60% 70% at 85% 90%, #ffc2c8 0%, rgba(255,194,200,0) 70%), #fff6f6; }
  #s1 .cam { position: absolute; inset: 0; perspective: 1500px; transform-style: preserve-3d; }
  .fw { position: absolute; left: 0; top: 0; background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(120,20,30,.16); transform-style: preserve-3d; }
  .fw .tb { height: 34px; background: #2a2a2e; display: flex; align-items: center; padding: 0 14px; gap: 7px; color: #ddd; font-size: 13px; }
  .fw .tb i { width: 9px; height: 9px; border-radius: 50%; background: #555; display: inline-block; }
  .fw .tb span { margin-left: 10px; }
  .fw .ln { height: 10px; border-radius: 5px; background: #eee; margin: 16px 18px 0; }
  .fw .ln.r { background: var(--pink); }
  .fw .btn { position: absolute; left: 18px; bottom: 16px; width: 90px; height: 28px; border-radius: 6px; background: var(--red); }
  #plane { position: absolute; left: 0; top: 0; width: 150px; height: 150px; }
  #s1 .q { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 84px; font-weight: 700; letter-spacing: .02em; }

  /* ---------- S2 prompt window ---------- */
  #s2 { background: radial-gradient(ellipse 70% 80% at 90% 100%, #ffc9ce 0%, rgba(255,201,206,0) 70%),
                    radial-gradient(ellipse 50% 60% at 0% 0%, #ffe0e3 0%, rgba(255,224,227,0) 70%), #fff; }
  #win2 { position: absolute; left: 410px; top: 250px; width: 1100px; height: 580px; }
  #win2 .chrome { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; color: #999; font-size: 15px; }
  #win2 .chrome i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
  #win2 .chrome .title { position: absolute; left: 0; right: 0; text-align: center; }
  #win2 .panel { position: absolute; left: 0; right: 0; top: 50px; bottom: 0; border: 3px solid var(--red); border-radius: 18px;
    display: grid; place-items: center; font-size: 46px; color: var(--red); font-weight: 500; }
  .tag { position: absolute; left: 0; top: 0; height: 50px; padding: 0 24px 0 16px; border-radius: 25px; background: var(--red); color: #fff;
    font-size: 23px; font-weight: 600; display: flex; align-items: center; gap: 12px; white-space: nowrap; box-shadow: 0 10px 24px rgba(224,36,49,.35); }
  .tag b { font-weight: 400; opacity: .8; }

  /* ---------- S3 timeline ---------- */
  #s3 { background: radial-gradient(ellipse 50% 60% at 0% 20%, #ffd9dc 0%, rgba(255,217,220,0) 70%), #fff; }
  #tl { position: absolute; left: 0; top: 0; width: 2600px; height: 1080px; }
  .bar { position: absolute; height: 60px; border-radius: 8px; color: #fff; font-size: 22px; font-weight: 600; padding: 17px 20px; white-space: nowrap; }
  .dia { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; background: var(--red); transform: rotate(45deg); }
  #head3 { position: absolute; left: 520px; top: 130px; height: 50px; width: 620px; background: var(--red); border-radius: 4px; }
  #rule3 { position: absolute; left: 0; right: 0; top: 200px; height: 2px; background: #ffd0d4; }
  #ph { position: absolute; top: 200px; width: 3px; height: 700px; background: var(--red); margin-left: -1px; }
  #ph:before { content: ''; position: absolute; left: -12px; top: -16px; border: 13px solid transparent; border-top: 18px solid var(--red); }
  #cap3 { position: absolute; left: 120px; bottom: 90px; font-size: 44px; font-weight: 700; }
  #cap3 em { font-style: normal; color: var(--red); }

  /* ---------- S4 pills ---------- */
  #s4 { background: #fff; }
  .pill { position: absolute; left: 50%; top: 50%; padding: 26px 64px; border-radius: 999px; font-size: 64px; font-weight: 500;
    white-space: nowrap; transform: translate(-50%, -50%); letter-spacing: -.01em; }

  /* ---------- S5 logo + rays ---------- */
  #s5 { background: #000; perspective: 1200px; }
  #rays { position: absolute; left: 50%; top: 50%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px; }
  #tile { position: absolute; left: 50%; top: 50%; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 64px;
    background: linear-gradient(150deg, #ff5a64 0%, #e02431 45%, #9c0f1b 100%); display: grid; place-items: center;
    box-shadow: 0 16px 0 #6d0a13, 0 30px 80px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.35); transform-style: preserve-3d; }
  #tile img { width: 190px; height: 190px; filter: brightness(0) invert(1); }

  /* ---------- S6 kinetic on dark ---------- */
  #s6 .line { position: absolute; left: 0; right: 0; top: 490px; text-align: center; font-size: 96px; font-weight: 700; }
  .slab { position: absolute; height: 70px; border-radius: 6px; }

  /* ---------- S7 carousel ---------- */
  #s7 { background: #fff; perspective: 1600px; }
  .card { position: absolute; left: 50%; top: 430px; width: 620px; height: 390px; margin: -195px 0 0 -310px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 40px 80px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.04); color: #fff; }
  .card .orb { position: absolute; border-radius: 50%; filter: blur(2px); }
  .card .who { position: absolute; left: 30px; top: 26px; font-size: 22px; font-weight: 600; opacity: .9; }
  .card .role { position: absolute; right: 30px; top: 28px; font-size: 16px; letter-spacing: .16em; font-weight: 700; opacity: .75; }
  .card .say { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); padding: 22px 46px; border-radius: 999px;
    background: rgba(255,255,255,.92); color: #111; font-size: 40px; font-weight: 700; white-space: nowrap; font-family: "Noto Sans JP", sans-serif; }
  .arrow { position: absolute; top: 430px; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: #1b1b1d;
    display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.25); }
  #cap7 { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-size: 38px; font-weight: 500; color: #333; }
  #cap7 em { font-style: normal; color: var(--red); font-weight: 700; }

  /* ---------- S8 selection ---------- */
  #s8 { background: #fff; }
  #hd8 { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-size: 26px; letter-spacing: .2em; color: var(--muted); font-weight: 600; }
  .opt { position: absolute; left: 50%; width: 460px; height: 64px; margin-left: -230px; border-radius: 12px; border: 2px solid #ffd0d4; background: #fff;
    display: grid; place-items: center; font-size: 27px; color: var(--red); font-weight: 500; }
  #sum { position: absolute; left: 50%; top: 540px; width: 640px; height: 420px; margin: -210px 0 0 -320px; border-radius: 20px; background: #fff;
    border: 1px solid #eee; box-shadow: 0 30px 70px rgba(0,0,0,.12); padding: 38px 44px; }
  #sum h3 { font-size: 30px; font-weight: 700; }
  #sum .row { display: flex; align-items: center; gap: 16px; margin-top: 18px; font-size: 23px; color: #444; }
  #sum .row span:first-child { width: 30px; text-align: center; }
  #sum .row b { margin-left: auto; font-weight: 600; color: #111; }
  #go { position: absolute; left: 44px; right: 44px; bottom: 36px; height: 66px; border-radius: 12px; background: var(--red); color: #fff;
    font-size: 28px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- S9 / S10 ---------- */
  #s9, #s10 { background: #fff; }
  #s9 .line { position: absolute; left: 0; right: 0; top: 480px; text-align: center; font-size: 92px; font-weight: 700; }
  #swoop { position: absolute; left: 0; top: 0; width: 300px; height: 300px; margin: -150px 0 0 -150px; }
  #mark { position: absolute; left: 0; top: 0; width: 400px; height: 400px; margin: -200px 0 0 -200px; }
  #word { position: absolute; left: 0; top: 0; font-size: 168px; font-weight: 600; color: var(--red); letter-spacing: -.035em; white-space: nowrap; }
  #sub10 { position: absolute; left: 0; top: 0; font-size: 40px; font-weight: 700; white-space: nowrap; }
  #by10 { position: absolute; left: 0; top: 0; font-size: 22px; letter-spacing: .18em; color: var(--muted); white-space: nowrap; }
  #by10 b { color: var(--ink); }
</style>
</head>
<body>
<div id="stage">

  <!-- S1: floating UI in 3D + question -->
  <section class="scene" id="s1">
    <div class="cam" id="cam1"></div>
    <div class="q jp" id="q1">つくりたいものは？</div>
    <svg id="plane" viewBox="0 0 100 100">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7580"/><stop offset=".6" stop-color="#e02431"/><stop offset="1" stop-color="#a3121f"/></linearGradient></defs>
      <path d="M8 50 L92 14 L66 88 L50 58 Z" fill="url(#pg)"/><path d="M50 58 L92 14 L66 88 Z" fill="#b8141f" opacity=".55"/>
    </svg>
  </section>

  <!-- S2: prompt window + role tags -->
  <section class="scene" id="s2">
    <div id="win2">
      <div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><div class="title">Orchestra — Agent</div></div>
      <div class="panel jp"><div id="ptext"></div></div>
    </div>
    <div id="tags"></div>
    <svg class="cursor" id="cur2" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15 L12.5 22 L15.5 20.6 L12 14 L19 14 Z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </section>

  <!-- S3: parallel agent timeline -->
  <section class="scene" id="s3">
    <div id="tl"><div id="head3"></div><div id="rule3"></div><div id="bars"></div><div id="ph"></div></div>
    <div id="cap3" class="jp">複数のAIが、<em>同時に</em>動く。</div>
  </section>

  <!-- S4: pill swaps -->
  <section class="scene" id="s4">
    <div class="pill jp" id="pill"></div>
  </section>

  <!-- S5: logo tile + rays -->
  <section class="scene" id="s5">
    <svg id="rays" viewBox="-1500 -1500 3000 3000"></svg>
    <div id="tile"><img src="logo.png" alt=""></div>
  </section>

  <!-- S6: kinetic text on dark -->
  <section class="scene" id="s6">
    <div id="slabs"></div>
    <div class="line jp" id="l6"><span class="w">AIを、</span><span class="w" style="color:#ff5561">指揮</span><span class="w">しよう。</span></div>
  </section>

  <!-- S7: model carousel -->
  <section class="scene" id="s7">
    <div id="cards"></div>
    <div class="arrow" id="al" style="left:520px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></div>
    <div class="arrow" id="ar" style="left:1400px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></div>
    <div id="cap7" class="jp">38以上のLLMから、<em>役割ごとに最適</em>なモデルを。</div>
  </section>

  <!-- S8: pick a model -> run -->
  <section class="scene jp" id="s8">
    <div id="hd8">CODING を担当するモデル</div>
    <div id="opts"></div>
    <div id="sum">
      <h3>Orchestra Agent — riddle</h3>
      <div class="row"><span>🧠</span><span>Leader</span><b>Gemini 2.5 Flash</b></div>
      <div class="row"><span>🔍</span><span>Search</span><b>Perplexity Sonar Pro</b></div>
      <div class="row"><span>💻</span><span>Coding</span><b>Claude Sonnet 4.5</b></div>
      <div class="row"><span>✅</span><span>Review</span><b>GPT-4.1</b></div>
      <div id="go">▶ 実行する</div>
    </div>
    <div class="dot" id="dot8"></div>
  </section>

  <!-- S9: statement + swoop -->
  <section class="scene" id="s9">
    <div class="line jp" id="l9"><span class="w">1つの</span><span class="w">プロンプトで、</span><span class="w" style="color:var(--red)">最高の</span><span class="w">チームを。</span></div>
  </section>

  <!-- S10: logo + wordmark -->
  <section class="scene" id="s10">
    <img id="mark" src="logo.png" alt="">
    <div id="word">Orchestra</div>
    <div id="sub10" class="jp">AIを、指揮せよ。</div>
    <div id="by10">POWERED BY <b>DIVISION API</b></div>
  </section>

  <img id="swoop" src="logo.png" alt="" style="display:none">
  <div id="fade"></div>
</div>

<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outQuint = x => 1 - Math.pow(1 - x, 5);
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const inExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function splitChars(el) {
  const txt = el.textContent; el.textContent = '';
  return [...txt].map(c => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; el.appendChild(s); return s; });
}
// blur-in reveal: from blurred/offset/transparent to crisp
function reveal(el, p, dx = 0, dy = 0, blur = 16) {
  el.style.opacity = clamp(p * 1.3);
  el.style.filter = p >= 1 ? 'none' : `blur(${(1 - p) * blur}px)`;
  el.style.transform = `translate(${(1 - p) * dx}px, ${(1 - p) * dy}px)`;
}
function stagger(els, t, a, step, d, dx = 40, dy = 0, blur = 16, ease = outCubic) {
  els.forEach((el, i) => reveal(el, ease(prog(t, a + i * step, a + i * step + d)), dx, dy, blur));
}
function mix(c1, c2, x) {
  const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
  const a = h(c1), b = h(c2);
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], x))).join(',')})`;
}
const LOGO = 'logo.png';

// ---------- timeline ----------
const T = {
  s1: [0, 3.4], s2: [3.4, 6.0], s3: [6.0, 8.4], s4: [8.4, 12.0], s5: [12.0, 14.4],
  s6: [14.4, 16.6], s7: [16.6, 19.6], s8: [19.6, 22.4], s9: [22.4, 24.6], s10: [24.6, 28],
};
const DURATION = 28;

// ---------- S1 ----------
const cam1 = $('#cam1');
const FW = [];
const titles = ['New Prompt', 'Agent', 'QuizCard.tsx', 'Review', 'Search', 'Terminal', 'Plan', 'New Prompt', 'api.ts'];
for (let i = 0; i < 9; i++) {
  const el = document.createElement('div');
  el.className = 'fw';
  const w = 300 + rnd() * 260, h = w * (.55 + rnd() * .25);
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.innerHTML = `<div class="tb"><i></i><i></i><i></i><span>${titles[i]}</span></div>` +
    Array.from({ length: 4 }, (_, k) => `<div class="ln ${k === 1 && i % 2 ? 'r' : ''}" style="width:${40 + rnd() * 50}%"></div>`).join('') +
    (i % 3 === 0 ? '<div class="btn"></div>' : '');
  cam1.appendChild(el);
  const side = i % 2 ? 1 : -1;
  FW.push({ el, w, h, x: 960 + side * (250 + rnd() * 650) - w / 2, y: 120 + rnd() * 800 - h / 2, z: -900 + rnd() * 900,
    rx: (rnd() - .5) * 50, ry: -side * (20 + rnd() * 30), rz: (rnd() - .5) * 30, sp: 180 + rnd() * 220, ph: rnd() * 6 });
}
const q1 = splitChars($('#q1'));

// ---------- S2 ----------
const PROMPT = 'クイズアプリ「リドル」を作って';
const TAGS = [['🔍', '検索', 'Perplexity'], ['📋', '設計', 'Gemini'], ['💻', '実装', 'Claude'], ['✅', 'レビュー', 'GPT']];
const tagEls = TAGS.map(([ic, r, m], i) => {
  const el = document.createElement('div');
  el.className = 'tag jp';
  el.innerHTML = `<span>${ic}</span>${r}<b>· ${m}</b>`;
  $('#tags').appendChild(el);
  return el;
});

// ---------- S3 ----------
const BARS = [
  // row, x, w, kind, label
  [0, 300, 360, 'p', ''], [0, 700, 520, 'p', ''], [1, 260, 640, 'r', 'Search · Perplexity'], [1, 920, 300, 'p', ''],
  [2, 380, 680, 'g', ''], [2, 1080, 600, 'g', ''], [3, 240, 180, 'p', ''], [3, 440, 420, 'r', 'Plan · Gemini'], [3, 1120, 280, 'p', ''],
  [4, 300, 520, 'r', 'Code · Claude'], [4, 840, 900, 'g', ''], [5, 560, 460, 'p', ''], [5, 1040, 380, 'r', 'Review · GPT'],
  [6, 200, 340, 'g', ''], [6, 1450, 300, 'p', ''],
];
const COLORS = { r: '#e8413f', p: '#ffd5d2', g: '#ececef' };
const barEls = BARS.map(([row, x, w, k, label], i) => {
  const el = document.createElement('div');
  el.className = 'bar';
  el.style.cssText += `top:${250 + row * 92}px; width:${w}px; background:${COLORS[k]}`;
  el.textContent = label;
  $('#bars').appendChild(el);
  return { el, x, row };
});
const diaEls = [];
[[1, [330, 380, 430, 760, 830, 900]], [3, [360, 520, 690, 780, 1250]], [5, [520, 580, 640, 880, 1280, 1340]]].forEach(([row, xs]) => xs.forEach(x => {
  const d = document.createElement('div'); d.className = 'dia';
  d.style.top = (250 + row * 92 - 16) + 'px';
  $('#bars').appendChild(d); diaEls.push({ el: d, x, row });
}));

// ---------- S4 ----------
const PILLS = [
  { a: 8.4, b: 9.5, text: 'マルチエージェント', bg: '#ffffff', pbg: '#fff0f1', col: '#e02431', glow: 'rgba(224,36,49,.18)' },
  { a: 9.5, b: 10.7, text: '自律型エージェント', bg: '#e02431', pbg: '#ef3542', col: '#ffffff', glow: 'rgba(255,120,130,.55)' },
  { a: 10.7, b: 12.0, text: 'VS Code 完全互換', bg: '#fff5f5', pbg: '#ffffff', col: '#e02431', glow: 'rgba(224,36,49,.2)' },
];
const pill = $('#pill');

// ---------- S5 rays ----------
(() => {
  const svg = $('#rays');
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = `<defs><radialGradient id="rg" cx="0" cy="0" r="1500" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ff3b3b"/><stop offset=".35" stop-color="#e0402a"/><stop offset=".7" stop-color="#b8471a"/><stop offset="1" stop-color="#6b2a0a"/></radialGradient>
    <filter id="rb"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
  const g = document.createElementNS(NS, 'g'); g.setAttribute('filter', 'url(#rb)'); g.id = 'rayg';
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = a0 + (Math.PI * 2 / n) * (.32 + (i % 3) * .08);
    const p = document.createElementNS(NS, 'path');
    const r = 1500, rin = 120;
    p.setAttribute('d', `M${Math.cos(a0) * rin},${Math.sin(a0) * rin} L${Math.cos(a0) * r},${Math.sin(a0) * r} L${Math.cos(a1) * r},${Math.sin(a1) * r} L${Math.cos(a1) * rin},${Math.sin(a1) * rin} Z`);
    p.setAttribute('fill', 'url(#rg)');
    g.appendChild(p);
  }
  svg.appendChild(g);
})();

// ---------- S6 slabs ----------
const SLABS = [
  { y: 440, w: 260, c: '#e8413f', a: 14.4, d: .9, dir: 1 }, { y: 560, w: 220, c: '#ffd5d2', a: 14.55, d: .9, dir: -1 },
  { y: 620, w: 480, c: '#e8413f', a: 14.9, d: 1.0, dir: 1 }, { y: 380, w: 180, c: '#ffd5d2', a: 15.2, d: 1.0, dir: -1 },
];
SLABS.forEach(s => { s.el = document.createElement('div'); s.el.className = 'slab'; s.el.style.cssText += `width:${s.w}px;top:${s.y}px;background:${s.c}`; $('#slabs').appendChild(s.el); });
const w6 = [...document.querySelectorAll('#l6 .w')];

// ---------- S7 cards ----------
const CARDS = [
  { who: 'Perplexity Sonar Pro', role: 'SEARCH', say: '“調べて”', bg: 'linear-gradient(135deg,#0f6b77,#0a2e36)', o: ['#34d3e6', '#1a8fa0'] },
  { who: 'Gemini 2.5 Pro', role: 'PLANNING', say: '“設計して”', bg: 'linear-gradient(135deg,#3b1d8f,#0d0b24)', o: ['#6f8cff', '#c04bff'] },
  { who: 'Claude Sonnet 4.5', role: 'CODING', say: '“書いて”', bg: 'linear-gradient(135deg,#8a3a22,#1d0f0a)', o: ['#ff9a6b', '#e0502c'] },
  { who: 'GPT-4.1', role: 'REVIEW', say: '“見直して”', bg: 'linear-gradient(135deg,#0c5b47,#06140f)', o: ['#3fe0a8', '#10a37f'] },
  { who: 'Grok 4.1', role: 'SEARCH', say: '“速く探して”', bg: 'linear-gradient(135deg,#3a3a3f,#050505)', o: ['#ffffff', '#8a8a95'] },
  { who: 'DeepSeek V3', role: 'REVIEW', say: '“検証して”', bg: 'linear-gradient(135deg,#2438b0,#0a0f33)', o: ['#6f86ff', '#ff4d7a'] },
];
CARDS.forEach(c => {
  const el = document.createElement('div');
  el.className = 'card';
  el.style.background = c.bg;
  el.innerHTML = `<div class="orb" style="width:360px;height:360px;left:120px;top:-170px;background:radial-gradient(circle at 40% 40%,${c.o[0]},${c.o[1]} 60%,transparent 72%)"></div>
    <div class="orb" style="width:360px;height:360px;left:150px;top:200px;background:radial-gradient(circle at 60% 60%,${c.o[1]},${c.o[0]} 55%,transparent 72%)"></div>
    <div class="who">${c.who}</div><div class="role">${c.role}</div><div class="say">${c.say}</div>`;
  $('#cards').appendChild(el);
  c.el = el;
});
const STEPS7 = [17.1, 17.7, 18.3, 18.9];

// ---------- S8 ----------
const OPTS = ['Claude Opus 4.6', 'Claude Sonnet 4.5', 'GPT-4.1', 'Gemini 2.5 Pro', 'DeepSeek V3'];
const optEls = OPTS.map((o, i) => {
  const el = document.createElement('div');
  el.className = 'opt'; el.style.top = (320 + i * 84) + 'px'; el.textContent = o;
  $('#opts').appendChild(el);
  return el;
});

// ---------- S9 / S10 ----------
const w9 = [...document.querySelectorAll('#l9 .w')];
const wordCh = splitChars($('#word'));
const subCh = splitChars($('#sub10'));

function scene(id, t) {
  const [a, b] = T[id];
  const on = t >= a && t < b;
  $('#' + id).style.display = on ? 'block' : 'none';
  return on;
}

// ---------- render ----------
function render(t) {
  // S1 — floating windows drift toward camera, question types in, paper plane lands
  if (scene('s1', t)) {
    const push = inExpo(prog(t, 2.85, 3.4));
    cam1.style.transform = `scale(${lerp(1, 1.1, prog(t, 0, 2.9)) + push * 1.6})`;
    for (const f of FW) {
      const z = f.z + t * f.sp;
      const blur = Math.min(14, Math.abs(z + 150) / 60);
      const x = f.x + Math.sin(t * .7 + f.ph) * 30, y = f.y + Math.cos(t * .6 + f.ph) * 25 - t * 20;
      f.el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${f.rx + t * 4}deg) rotateY(${f.ry - t * 6}deg) rotateZ(${f.rz}deg)`;
      f.el.style.filter = `blur(${blur}px)`;
      f.el.style.opacity = clamp((t + .2) * 2) * (1 - push);
    }
    stagger(q1, t, .9, .06, .45, 0, 30, 18);
    const qz = 1 + push * 2.2;
    $('#q1').style.transform = `scale(${qz})`;
    $('#q1').style.opacity = 1 - push;
    const pf = outQuint(prog(t, .2, 1.7));
    const px = lerp(-200, 1470, pf), py = lerp(1000, 420, pf) - Math.sin(pf * Math.PI) * 220 + Math.sin(t * 3) * 8 * pf;
    const pl = $('#plane');
    pl.style.transform = `translate(${px}px,${py}px) rotate(${lerp(-160, -8, pf) + Math.sin(t * 2.5) * 5}deg) scale(${lerp(1.6, 1, pf) * (1 + push * 3)})`;
    pl.style.opacity = 1 - push;
    pl.style.filter = `drop-shadow(0 20px 20px rgba(160,20,30,.3))`;
  }

  // S2 — prompt typed, cursor drops role tags
  if (scene('s2', t)) {
    const inP = outExpo(prog(t, 3.4, 3.9));
    const outP = inExpo(prog(t, 5.6, 6.0));
    const w = $('#win2');
    w.style.transform = `scale(${lerp(1.25, 1, inP) + outP * .5})`;
    w.style.filter = `blur(${(1 - inP) * 14 + outP * 20}px)`;
    w.style.opacity = 1 - outP;
    const n = Math.floor(PROMPT.length * prog(t, 3.75, 4.55));
    $('#ptext').textContent = PROMPT.slice(0, n) + (t < 4.9 && Math.floor(t * 4) % 2 ? '|' : '');
    const panelBg = mix('#fdf8f3', '#ecebea', prog(t, 5.0, 5.3));
    $('#win2 .panel').style.background = panelBg;
    const cp = inOut(prog(t, 3.7, 4.6));
    const cx = lerp(1500, 1380, cp), cy = lerp(900, 470, cp);
    const click = Math.exp(-Math.pow((t - 4.68) / .06, 2));
    $('#cur2').style.transform = `translate(${cx}px,${cy}px) scale(${1 - click * .2})`;
    $('#cur2').style.opacity = 1 - outP;
    tagEls.forEach((el, i) => {
      const p = outBack(prog(t, 4.7 + i * .09, 5.05 + i * .09));
      const tx = lerp(cx + 10, 1420, outExpo(prog(t, 4.7 + i * .09, 5.1 + i * .09)));
      const ty = lerp(cy + 10, 400 + i * 66, outExpo(prog(t, 4.7 + i * .09, 5.1 + i * .09)));
      el.style.transform = `translate(${tx}px,${ty}px) scale(${clamp(p, 0, 1.3)})`;
      el.style.opacity = clamp(p * 2) * (1 - outP);
      el.style.filter = `blur(${(1 - clamp(p)) * 8 + outP * 20}px)`;
    });
  }

  // S3 — timeline bars slide in, playhead sweeps
  if (scene('s3', t)) {
    const pan = inOut(prog(t, 6.0, 8.4));
    $('#tl').style.transform = `translateX(${lerp(40, -260, pan)}px)`;
    barEls.forEach((b, i) => {
      const p = outExpo(prog(t, 6.0 + b.row * .05 + (i % 2) * .05, 6.7 + b.row * .05 + (i % 2) * .05));
      b.el.style.left = (b.x + (1 - p) * 900) + 'px';
      b.el.style.opacity = clamp(p * 3);
      b.el.style.filter = p < .98 ? `blur(${(1 - p) * 10}px)` : 'none';
    });
    diaEls.forEach((d, i) => {
      const p = outBack(prog(t, 6.4 + i * .02, 6.7 + i * .02));
      d.el.style.left = d.x + 'px';
      d.el.style.transform = `rotate(45deg) scale(${clamp(p, 0, 1.4)})`;
    });
    $('#head3').style.transform = `scaleX(${outExpo(prog(t, 6.0, 6.5))})`;
    $('#head3').style.transformOrigin = 'left';
    $('#ph').style.left = lerp(460, 1600, inOut(prog(t, 6.2, 8.3))) + 'px';
    reveal($('#cap3'), outCubic(prog(t, 6.8, 7.3)), -40, 0, 14);
    const outP = inExpo(prog(t, 8.1, 8.4));
    $('#s3').style.filter = outP ? `blur(${outP * 20}px)` : 'none';
  }

  // S4 — pill text swaps with colour flash
  if (scene('s4', t)) {
    const idx = PILLS.findIndex(p => t >= p.a && t < p.b);
    const P = PILLS[Math.max(0, idx)];
    if (pill.dataset.i != idx) {
      pill.textContent = P.text; P.chars = splitChars(pill); pill.dataset.i = idx;
    }
    $('#s4').style.background = P.bg;
    pill.style.background = P.pbg;
    pill.style.color = P.col;
    const pin = outBack(prog(t, P.a, P.a + .35));
    const pout = inExpo(prog(t, P.b - .18, P.b));
    pill.style.boxShadow = `0 0 0 ${lerp(0, 22, outCubic(prog(t, P.a, P.a + .5)))}px ${P.glow}, 0 20px 60px ${P.glow}`;
    pill.style.transform = `translate(-50%,-50%) scale(${lerp(.7, 1, pin) + pout * .15})`;
    pill.style.opacity = 1 - pout;
    pill.style.filter = pout ? `blur(${pout * 16}px)` : 'none';
    stagger(P.chars, t, P.a + .05, .035, .3, 30, 0, 14);
  }

  // S5 — 3D logo tile rises from grey into black, sunburst rays explode
  if (scene('s5', t)) {
    const bgp = prog(t, 12.0, 12.7);
    $('#s5').style.background = bgp < .5 ? mix('#8c8c8c', '#2c2c2c', bgp * 2) : mix('#2c2c2c', '#000000', (bgp - .5) * 2);
    const tp = outQuint(prog(t, 12.0, 12.9));
    const outP = inExpo(prog(t, 14.05, 14.4));
    const tile = $('#tile');
    tile.style.transform = `translateY(${lerp(520, 0, tp)}px) rotateX(${lerp(75, 0, tp)}deg) rotateY(${lerp(-60, 0, tp) + Math.sin(t * 2) * 6 * tp}deg) rotateZ(${lerp(-25, 0, tp)}deg) scale(${1 + .06 * Math.sin(prog(t, 12.85, 13.2) * Math.PI) - outP * .6})`;
    tile.style.opacity = 1 - outP;
    const rp = outExpo(prog(t, 12.8, 13.6));
    const rays = $('#rays');
    rays.style.transform = `scale(${lerp(.05, 1, rp) + outP * 1.5}) rotate(${t * 22}deg)`;
    rays.style.opacity = clamp(rp * 2) * (1 - outP);
  }

  // S6 — words on dark, slabs sweep, background lifts to light grey
  if (scene('s6', t)) {
    const bp = prog(t, 15.3, 16.5);
    const bg = bp < .5 ? mix('#000000', '#6e6e6e', bp * 2) : mix('#6e6e6e', '#dcdcdc', (bp - .5) * 2);
    $('#s6').style.background = bg;
    SLABS.forEach(s => {
      const p = inOut(prog(t, s.a, s.a + s.d));
      const x = s.dir > 0 ? lerp(-s.w - 50, 1970, p) : lerp(1970, -s.w - 50, p);
      s.el.style.transform = `translateX(${x}px)`;
    });
    stagger(w6, t, 14.6, .28, .5, 80, 0, 18, outExpo);
    $('#l6').style.color = mix('#ffffff', '#141416', prog(t, 16.0, 16.5));
    const sc = lerp(1, .9, prog(t, 14.6, 16.6));
    $('#l6').style.transform = `scale(${sc})`;
  }

  // S7 — carousel of model cards
  if (scene('s7', t)) {
    $('#s7').style.background = mix('#dcdcdc', '#ffffff', prog(t, 16.6, 16.9));
    let pos = 0;
    STEPS7.forEach(s => { pos += outExpo(prog(t, s, s + .45)); });
    const enter = outQuint(prog(t, 16.6, 17.1));
    CARDS.forEach((c, i) => {
      const d = i - pos;
      const x = d * 700, ry = -d * 28, sc = 1 - Math.min(Math.abs(d), 2) * .16;
      c.el.style.transform = `translateX(${x}px) translateY(${(1 - enter) * 300}px) rotateY(${ry}deg) scale(${sc})`;
      c.el.style.opacity = clamp(1.6 - Math.abs(d)) * enter;
      c.el.style.zIndex = 10 - Math.round(Math.abs(d));
      // motion blur while sliding
      const v = STEPS7.reduce((m, s) => m + Math.max(0, 1 - Math.abs((t - s - .12) / .14)), 0);
      c.el.style.filter = v > .02 ? `blur(${v * 5}px)` : 'none';
    });
    const press = STEPS7.reduce((m, s) => Math.max(m, Math.exp(-Math.pow((t - s + .02) / .06, 2))), 0);
    $('#ar').style.transform = `scale(${enter * (1 - press * .18)})`;
    $('#al').style.transform = `scale(${enter})`;
    $('#ar').style.background = press > .3 ? '#e02431' : '#1b1b1d';
    reveal($('#cap7'), outCubic(prog(t, 17.0, 17.5)), 0, 30, 12);
  }

  // S8 — pick a model, list collapses into run card, click
  if (scene('s8', t)) {
    reveal($('#hd8'), outCubic(prog(t, 19.6, 19.9)), 0, 20, 10);
    const collapse = inOut(prog(t, 20.75, 21.1));
    optEls.forEach((el, i) => {
      const p = outExpo(prog(t, 19.62 + i * .06, 19.95 + i * .06));
      const sel = i === 1 && t > 20.45;
      el.style.background = sel ? '#e02431' : '#fff';
      el.style.color = sel ? '#fff' : '#e02431';
      el.style.boxShadow = sel ? '0 0 0 8px rgba(224,36,49,.16), 0 16px 40px rgba(224,36,49,.35)' : 'none';
      el.style.opacity = clamp(p * 2) * (1 - collapse);
      el.style.filter = `blur(${(1 - p) * 10 + collapse * 12}px)`;
      el.style.transform = `translateY(${(1 - p) * 40 + collapse * (540 - (320 + i * 84 + 32)) * .7}px) scale(${(sel ? 1.06 : 1) * lerp(1, .7, collapse)})`;
    });
    const sp = outBack(prog(t, 20.95, 21.35));
    const sum = $('#sum');
    sum.style.opacity = clamp(sp * 2);
    sum.style.transform = `scale(${lerp(.6, 1, clamp(sp, 0, 1.2))})`;
    $('#hd8').style.opacity = 1 - collapse;
    // cursor dot path: in -> option 2 -> run button
    const d8 = $('#dot8');
    const a1 = inOut(prog(t, 19.9, 20.4)), a2 = inOut(prog(t, 21.35, 21.8));
    let x = lerp(1500, 1100, a1), y = lerp(900, 320 + 84 + 32, a1);
    x = lerp(x, 1060, a2); y = lerp(y, 540 + 210 - 36 - 33, a2);
    const click1 = Math.exp(-Math.pow((t - 20.45) / .06, 2)), click2 = Math.exp(-Math.pow((t - 21.9) / .06, 2));
    d8.style.transform = `translate(${x}px,${y}px) scale(${1 - .35 * (click1 + click2)})`;
    d8.style.opacity = clamp(prog(t, 19.85, 20.0)) * (1 - prog(t, 22.2, 22.4));
    const go = $('#go');
    const done = t > 22.0;
    go.textContent = done ? '✓ 完了 · 12.4s' : '▶ 実行する';
    go.style.background = done ? '#18a058' : (click2 > .3 ? '#b01723' : '#e02431');
    go.style.transform = `scale(${1 - click2 * .05})`;
  }

  // S9 — statement, then giant logo swoops in
  const sw = $('#swoop');
  if (scene('s9', t)) {
    stagger(w9, t, 22.5, .24, .45, 70, 0, 16, outExpo);
    const out = prog(t, 24.0, 24.35);
    $('#l9').style.opacity = 1 - out;
    $('#l9').style.transform = `scale(${1 + out * .1})`;
  }
  const swp = prog(t, 23.95, 24.9);
  if (swp > 0 && swp < 1) {
    const e = outQuint(swp);
    sw.style.display = 'block';
    sw.style.transform = `translate(${lerp(300, 960, e)}px, ${lerp(900, 500, e)}px) rotate(${lerp(-120, 0, e)}deg) scale(${lerp(14, 400 / 300, e)})`;
  } else sw.style.display = 'none';

  // S10 — logo settles left, wordmark types out
  if (scene('s10', t)) {
    const slide = inOut(prog(t, 25.0, 25.5));
    const mx = lerp(960, 560, slide), my = 500;  // ring is ~52% of the image, so ~210px wide
    const wob = Math.sin(prog(t, 24.6, 25.2) * Math.PI * 2) * 6 * (1 - prog(t, 24.6, 25.2));
    $('#mark').style.transform = `translate(${mx}px,${my}px) rotate(${wob + (t - 24.6) * 8}deg)`;
    const wx = 700, wy = 392;
    $('#word').style.transform = `translate(${wx}px,${wy}px)`;
    stagger(wordCh, t, 25.25, .055, .35, 40, 0, 14);
    $('#sub10').style.transform = `translate(${wx + 10}px,${wy + 205}px)`;
    stagger(subCh, t, 25.9, .04, .35, 20, 0, 10);
    const by = $('#by10');
    by.style.transform = `translate(${wx + 12}px,${wy + 285}px)`;
    by.style.opacity = outCubic(prog(t, 26.4, 26.9));
  }
  $('#fade').style.opacity = prog(t, 27.45, 27.95);
}
window.render = render;
window.DURATION = DURATION;
window.ready = document.fonts.load('700 1em "Noto Sans JP"', 'あ')
  .then(() => Promise.all(['500 1em Inter', '600 1em Inter', '400 1em "Noto Sans JP"', '500 1em "Noto Sans JP"'].map(f => document.fonts.load(f, 'Aあ'))))
  .then(() => document.fonts.ready)
  .then(() => new Promise(r => { const img = new Image(); img.onload = img.onerror = r; img.src = LOGO; }))
  .then(() => { render(0); return true; });

// Preview mode: open promo.html in a browser to watch it loop in real time.
if (!/render=1/.test(location.search)) {
  window.ready.then(() => {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
