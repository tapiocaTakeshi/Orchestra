<!--
	Minimal Welcome — Electron renderer 上で読み込む静的マークアップ。
	`minimalWelcome.css` と `minimalWelcome.ts` を同フォルダで参照する。
	テーマ色は VS Code のトークンを継承する。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
	<title>Welcome</title>
	<link rel="stylesheet" href="./minimalWelcome.css" />
</head>
<body class="minimal-welcome">
	<main class="minimal-welcome__container" aria-labelledby="mw-title">
		<header class="minimal-welcome__header">
			<div class="minimal-welcome__brand" aria-hidden="true">
				<span class="minimal-welcome__brand-mark"></span>
				<span>Workspace</span>
			</div>
			<h1 id="mw-title" class="minimal-welcome__title">こんにちは。</h1>
			<p class="minimal-welcome__subtitle">
				必要なものだけを、必要なときに。新しい作業を静かに始めましょう。
			</p>
		</header>

		<section class="minimal-welcome__section" aria-labelledby="mw-start">
			<h2 id="mw-start" class="minimal-welcome__section-title">Start</h2>
			<ul class="minimal-welcome__actions" role="list">
				<li>
					<button type="button" class="minimal-welcome__action" data-command="workbench.action.files.newUntitledFile">
						<svg class="minimal-welcome__action-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
							<path d="M3 2h6l4 4v8H3z" /><path d="M9 2v4h4" />
						</svg>
						<span class="minimal-welcome__action-label">New File</span>
						<span class="minimal-welcome__action-shortcut">⌘N</span>
					</button>
				</li>
				<li>
					<button type="button" class="minimal-welcome__action" data-command="workbench.action.files.openFolder">
						<svg class="minimal-welcome__action-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
							<path d="M2 4h4l2 2h6v7H2z" />
						</svg>
						<span class="minimal-welcome__action-label">Open Folder…</span>
						<span class="minimal-welcome__action-shortcut">⌘O</span>
					</button>
				</li>
				<li>
					<button type="button" class="minimal-welcome__action" data-command="git.clone">
						<svg class="minimal-welcome__action-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
							<circle cx="5" cy="4" r="1.5" /><circle cx="5" cy="12" r="1.5" /><circle cx="11" cy="8" r="1.5" />
							<path d="M5 5.5v5M6.5 8H9.5" />
						</svg>
						<span class="minimal-welcome__action-label">Clone Repository…</span>
						<span class="minimal-welcome__action-shortcut"></span>
					</button>
				</li>
			</ul>
		</section>

		<section class="minimal-welcome__section" aria-labelledby="mw-recent">
			<h2 id="mw-recent" class="minimal-welcome__section-title">Recent</h2>
			<ul id="mw-recent-list" class="minimal-welcome__recents" role="list">
				<li class="minimal-welcome__empty" data-empty>最近開いたワークスペースはありません。</li>
			</ul>
		</section>

		<footer class="minimal-welcome__footer">
			<label class="minimal-welcome__toggle">
				<input id="mw-show-on-startup" type="checkbox" />
				<span>起動時に表示する</span>
			</label>
			<span aria-hidden="true">⌘⇧P でコマンドを検索</span>
		</footer>
	</main>

	<script type="module" src="./minimalWelcome.js"></script>
</body>
</html>
