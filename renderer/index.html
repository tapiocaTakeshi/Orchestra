<!doctype html>
<html lang="ja" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App</title>
    <link rel="stylesheet" href="./styles/minimal.css" />
  </head>
  <body>
    <div class="app">
      <!-- Title bar -->
      <header class="titlebar">
        <span class="title">App</span>
        <div class="actions">
          <button class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
            <!-- simple sun/moon glyph -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Main -->
      <main class="container stack-lg" style="overflow:auto;">
        <section class="stack">
          <h1>ようこそ</h1>
          <p class="text-muted">
            余白とコントラストにこだわった、ミニマルなデスクトップ体験。
          </p>
        </section>

        <section class="card stack">
          <h2 class="card-title">はじめる</h2>
          <p class="card-desc">最初の項目を作成して、ワークスペースを整えましょう。</p>
          <div class="row">
            <input class="input" placeholder="新しい項目のタイトル…" aria-label="新しい項目のタイトル" />
            <button class="btn btn-primary">追加</button>
          </div>
        </section>

        <section class="stack">
          <h2>最近の項目</h2>
          <ul class="list" id="recent">
            <li>
              <span>設計メモ</span>
              <span class="spacer"></span>
              <span class="badge">draft</span>
            </li>
            <li>
              <span>リリースノート</span>
              <span class="spacer"></span>
              <span class="badge">v0.1</span>
            </li>
            <li>
              <span>TODO</span>
              <span class="spacer"></span>
              <span class="kbd">⌘K</span>
            </li>
          </ul>
        </section>
      </main>

      <!-- Status bar -->
      <footer class="statusbar">
        <span id="status">Ready</span>
        <span class="spacer"></span>
        <span>UTF-8</span>
        <span>·</span>
        <span>LF</span>
      </footer>
    </div>

    <script src="./preload-theme.js"></script>
  </body>
</html>
