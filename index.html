<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>App</title>
    <link rel="stylesheet" href="./src/styles/index.css" />
  </head>
  <body>
    <div class="app">
      <!-- Titlebar -->
      <header class="titlebar">
        <span class="titlebar__title">App</span>
        <div class="titlebar__actions">
          <button id="themeToggle" class="btn btn--ghost btn--icon" title="テーマ切替" aria-label="テーマ切替">
            ◐
          </button>
        </div>
      </header>

      <!-- Main -->
      <main class="main">
        <div class="container stack-lg">
          <section class="stack">
            <span class="eyebrow">Overview</span>
            <h1>シンプルに、必要なものだけを。</h1>
            <p class="muted">
              余白とタイポグラフィを主役にしたミニマルなデスクトップ体験。
              装飾を削ぎ落とし、コンテンツに集中できる UI を提供します。
            </p>
            <div class="row">
              <button class="btn btn--primary" id="primaryAction">はじめる</button>
              <button class="btn" id="secondaryAction">詳細</button>
            </div>
          </section>

          <section class="stack">
            <span class="eyebrow">Quick actions</span>
            <div class="row" style="gap: var(--space-4); align-items: stretch; flex-wrap: wrap;">
              <article class="card" style="flex: 1 1 220px;">
                <h3 class="card__title">新規作成</h3>
                <p class="card__desc">空のドキュメントから始めます。</p>
              </article>
              <article class="card" style="flex: 1 1 220px;">
                <h3 class="card__title">開く</h3>
                <p class="card__desc">既存のファイルを開いて続きから。</p>
              </article>
              <article class="card" style="flex: 1 1 220px;">
                <h3 class="card__title">テンプレート</h3>
                <p class="card__desc">用途別のテンプレートを利用。</p>
              </article>
            </div>
          </section>

          <section class="stack">
            <div class="row row--between">
              <span class="eyebrow">Recent</span>
              <span class="badge">0 items</span>
            </div>
            <ul class="list" id="recentList">
              <li class="empty">
                <div>まだ何もありません</div>
                <div class="empty__hint">上のアクションから始められます</div>
              </li>
            </ul>
          </section>
        </div>
      </main>
    </div>

    <script src="./src/renderer/renderer.js"></script>
  </body>
</html>
