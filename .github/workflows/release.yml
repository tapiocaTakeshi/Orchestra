name: Release

# タグ ("v*") を push すると 3 OS でビルドし、
# 成果物を GitHub Release にアップロードする。
# 手動トリガーも可能 (workflow_dispatch)。
#
# 注意:
# - macOS arm64 ジョブは macos-14 (Apple Silicon) を使う (gulp vscode-darwin-arm64 が必要)。
# - Windows / Linux は x64 ビルド。arm64 が要るなら matrix を増やす。
# - 全 OS でフルビルドが走るため 1 回 30〜90 分かかる想定。
# - 一部 OS だけ自動化したい場合は不要なジョブを削除/コメントアウトする。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ (例: v1.4.10)。タグが未存在なら作成して push される。'
        required: true
        default: 'v0.0.0-test'
      draft:
        description: 'ドラフトリリースとして作成する'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  ORCHESTRA_REPO: tapiocaTakeshi/Orchestra
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  CHILD_CONCURRENCY: '1'
  # VSCode のフルビルドはデフォルトの 2GB ヒープでは OOM するため広めに確保する。
  # ランナーの RAM (mac-14: 7GB / windows/linux: 16GB) より大きい値は意味がないので 6144 程度で十分。
  NODE_OPTIONS: '--max-old-space-size=6144'
  # push 時は ref_name (= タグ), workflow_dispatch 時は inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  # ---------- macOS (arm64) ----------
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    timeout-minutes: 120
    # @vscode/ripgrep の postinstall が GitHub Releases API を叩いて 403 になるのを回避するため、
    # ジョブ全体に GITHUB_TOKEN を渡しておく。
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Developer ID 署名 + Notarization 用 Secrets。
      # 未登録の場合はジョブ内で ad-hoc 署名にフォールバックする。
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Setup signing keychain
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/buildagent.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # base64 デコード。Secret に改行や余計な空白が混じると base64 が壊れるので
          # printf + tr で確実に削ぎ落としてからデコードする。
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" \
            | tr -d ' \t\r\n' \
            | base64 --decode > "$CERT_PATH"

          # ファイル形式の健全性チェック（PKCS12 = ASN.1 SEQUENCE で 0x30 0x82 から始まる）
          echo "::group::Decoded p12 inspection"
          ls -la "$CERT_PATH"
          file "$CERT_PATH" || true
          # 先頭 4 バイトを 16 進ダンプして PKCS12 マジックを確認
          xxd -l 4 "$CERT_PATH" || true
          if [ ! -s "$CERT_PATH" ]; then
            echo "ERROR: Decoded p12 is empty. MACOS_CERTIFICATE_P12_BASE64 が空 or 不正な可能性があります。"
            exit 1
          fi
          MAGIC=$(xxd -p -l 2 "$CERT_PATH" || true)
          if [ "$MAGIC" != "3082" ]; then
            echo "ERROR: Decoded file does not look like a PKCS12 (.p12)."
            echo "       Magic bytes were 0x$MAGIC (expected 0x3082)."
            echo "       'security import' でエクスポートしたか、改行混入が無いか確認してください。"
            exit 1
          fi
          echo "::endgroup::"

          # 一時 keychain を作成して unlock
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 証明書を import (-f pkcs12 を明示せず auto-detect させる方が安定)
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -k "$KEYCHAIN_PATH"

          # 検索パスに追加（既存 keychain も維持）
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          # codesign / electron-osx-sign からの自動アクセスを許可
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # 署名できる identity が見えているか念のため検証
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build (compile + electron package)
        # release-macos は ad-hoc 署名を含むため、CI では分割実行する
        run: |
          set -euo pipefail
          npm run bac
          npm run gulp vscode-darwin-arm64

      - name: Code sign with Developer ID
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          APP_DIR="$(cd .. && pwd)/VSCode-darwin-arm64"
          APP="$APP_DIR/Orchestra.app"
          ENT_DIR="$GITHUB_WORKSPACE/build/azure-pipelines/darwin"

          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found"
            ls -la "$APP_DIR" || true
            exit 1
          fi

          # 既存の拡張属性 (quarantine 等) は Notary 検証を弱らせるので一度クリア
          xattr -cr "$APP"

          CSF=(
            --force
            --options runtime
            --timestamp
            --keychain "$KEYCHAIN_PATH"
            --sign "$MACOS_CODESIGN_IDENTITY"
          )

          # Mach-O magic 判定 (cffaedfe / cefaedfe / feedfacf / feedface /
          # cafebabe (universal) / bebafeca (universal byte-swapped))
          is_macho() {
            local f="$1"
            [ -f "$f" ] && [ ! -L "$f" ] || return 1
            local m
            m=$(xxd -p -l 4 "$f" 2>/dev/null || true)
            case "$m" in
              cffaedfe|cefaedfe|feedfacf|feedface|cafebabe|bebafeca) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 5 段階の depth-first 署名:
          #   Phase 0: 全 Mach-O から既存署名 (build-time ad-hoc 等) を完全に除去
          #   Phase 1: bundle main executable を除く全 Mach-O を最深から個別署名
          #   Phase 2: .framework バンドルを最深から (内部の main lib も含めて再署名される)
          #   Phase 3: 入れ子の .app バンドルを最深から (helper は専用 entitlements)
          #   Phase 4: トップレベル .app バンドルに entitlements 付き署名
          #            (Contents/MacOS/Electron はこの段階で唯一署名される)

          echo "::group::Phase 0: strip existing signatures from all Mach-O files"
          STRIPPED=0
          while IFS= read -r -d '' f; do
            if is_macho "$f"; then
              if codesign --remove-signature "$f" 2>/dev/null; then
                STRIPPED=$((STRIPPED+1))
              fi
            fi
          done < <(find "$APP" -type f -print0)
          echo "Phase 0 stripped signatures from $STRIPPED Mach-O file(s)."
          echo "::endgroup::"

          # bundle main executable 判定。Phase 1 ではこれらを除外し、Phase 2/3/4 の
          # bundle 署名で初めて署名する。
          # 1. */Contents/MacOS/* 直下のファイルは全て .app の main exec として扱う
          #    (Electron app は bundle 名 != binary 名なので名前比較は使わない)
          # 2. *.framework/Versions/<v>/<framework_name> も framework の main lib
          is_bundle_main () {
            local f="$1"
            case "$f" in
              */Contents/MacOS/*)
                return 0
                ;;
              *.framework/Versions/*)
                # f = .../<X>.framework/Versions/<v>/<file>...
                # f の grandparent が .../<X>.framework/Versions ならファイルは
                # Versions/<v>/ 直下にいる。さらに basename が framework 名と
                # 一致すれば main lib。
                local grand
                grand=$(dirname "$(dirname "$f")")
                if [ "$(basename "$grand")" = "Versions" ]; then
                  local fw fw_name exe_name
                  fw=$(dirname "$grand")
                  fw_name=$(basename "$fw" .framework)
                  exe_name=$(basename "$f")
                  [ "$exe_name" = "$fw_name" ] && return 0
                fi
                ;;
            esac
            return 1
          }

          echo "::group::Phase 1: sign individual Mach-O files (skip bundle main executables)"
          SIGNED_COUNT=0
          SKIPPED_COUNT=0
          while IFS= read -r -d '' f; do
            if is_macho "$f"; then
              if is_bundle_main "$f"; then
                echo "  [skip-main] $f"
                SKIPPED_COUNT=$((SKIPPED_COUNT+1))
                continue
              fi
              echo "  $f"
              codesign "${CSF[@]}" "$f"
              SIGNED_COUNT=$((SIGNED_COUNT+1))
            fi
          done < <(find "$APP" -depth -type f -print0)
          echo "Phase 1 signed $SIGNED_COUNT files (skipped $SKIPPED_COUNT bundle main executables)."
          echo "::endgroup::"

          echo "::group::Phase 2: sign frameworks (depth-first)"
          while IFS= read -r -d '' fw; do
            echo "  $fw"
            codesign "${CSF[@]}" "$fw"
          done < <(find "$APP" -depth -mindepth 1 -name "*.framework" -type d -print0)
          echo "::endgroup::"

          echo "::group::Phase 3: sign nested .app bundles (depth-first)"
          while IFS= read -r -d '' subapp; do
            base=$(basename "$subapp")
            case "$base" in
              "Orchestra Helper (GPU).app")
                ent="$ENT_DIR/helper-gpu-entitlements.plist" ;;
              "Orchestra Helper (Renderer).app")
                ent="$ENT_DIR/helper-renderer-entitlements.plist" ;;
              "Orchestra Helper (Plugin).app")
                ent="$ENT_DIR/helper-plugin-entitlements.plist" ;;
              *)
                ent="$ENT_DIR/app-entitlements.plist" ;;
            esac
            echo "  $base  (entitlements=$(basename "$ent"))"
            codesign "${CSF[@]}" --entitlements "$ent" "$subapp"
          done < <(find "$APP" -depth -mindepth 1 -name "*.app" -type d -print0)
          echo "::endgroup::"

          echo "::group::Phase 4: sign main app bundle (signs Contents/MacOS/Electron too)"
          codesign "${CSF[@]}" --entitlements "$ENT_DIR/app-entitlements.plist" "$APP"
          echo "::endgroup::"

          echo "::group::Diagnose Electron binary signature"
          codesign -d -v --verbose=4 "$APP/Contents/MacOS/Electron" 2>&1 || true
          echo "---"
          codesign --display --entitlements - "$APP/Contents/MacOS/Electron" 2>&1 || true
          echo "::endgroup::"

          echo "::group::Verify"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -t exec -vvv "$APP" || true
          echo "::endgroup::"

      - name: Ad-hoc sign (fallback)
        if: env.MACOS_CODESIGN_IDENTITY == ''
        run: |
          echo "::warning::MACOS_CODESIGN_IDENTITY が未設定のため ad-hoc 署名でビルドします。"
          echo "::warning::ダウンロードした .app は『壊れている』と表示されます。"
          npm run sign-macos

      - name: Create DMG and ZIP
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_DIR="$(cd .. && pwd)/VSCode-darwin-arm64"
          if [ ! -d "$APP_DIR/Orchestra.app" ]; then
            echo "ERROR: Orchestra.app not found at $APP_DIR"
            ls -la "$APP_DIR" || true
            exit 1
          fi
          DMG_PATH="artifacts/Orchestra-${RELEASE_TAG}-darwin-arm64.dmg"
          ZIP_PATH="$GITHUB_WORKSPACE/artifacts/Orchestra-${RELEASE_TAG}-darwin-arm64.zip"
          hdiutil create \
            -volname "Orchestra" \
            -srcfolder "$APP_DIR/Orchestra.app" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          (cd "$APP_DIR" && zip -ry "$ZIP_PATH" Orchestra.app)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -la artifacts/

      - name: Sign DMG
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          codesign --force \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_PATH"
          codesign --verify --verbose "$DMG_PATH"

      - name: Notarize and staple DMG
        if: env.MACOS_CODESIGN_IDENTITY != '' && env.MACOS_NOTARIZATION_APPLE_ID != ''
        run: |
          set -euo pipefail
          echo "::group::Submit to Apple notary service"
          SUBMIT_OUT=$(mktemp)
          if ! xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
              --password "$MACOS_NOTARIZATION_PASSWORD" \
              --wait \
              --output-format json \
              | tee "$SUBMIT_OUT"; then
            echo "::error::notarytool submit failed."
            exit 1
          fi
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$SUBMIT_OUT")
          SUB_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id',''))" "$SUBMIT_OUT")
          echo "Submission ID: $SUB_ID"
          echo "Status:        $STATUS"
          echo "::endgroup::"

          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::notarytool log (submission $SUB_ID)"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
              --password "$MACOS_NOTARIZATION_PASSWORD" || true
            echo "::endgroup::"
            echo "::error::Notarization rejected (status=$STATUS). 上のログで原因を確認してください。"
            exit 1
          fi

          echo "::group::Staple notarization ticket (with retry)"
          # CloudKit 伝播ラグで最初の数十秒〜数分はチケットが取れず Error 65 になることがある。
          # 6 回 × 30 秒 = 最大 3 分リトライする。
          STAPLED=0
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$DMG_PATH"; then
              echo "Stapling succeeded on attempt $attempt."
              STAPLED=1
              break
            fi
            echo "Stapling attempt $attempt failed (CloudKit propagation lag); retry in 30s..."
            sleep 30
          done

          if [ "$STAPLED" -ne 1 ]; then
            echo "::warning::Stapling failed after retries. DMG はオンライン Notarization 済みなので動作はしますが,"
            echo "::warning::オフライン起動時に Gatekeeper の確認ダイアログが出る可能性があります。"
            echo "::warning::必要なら後で 'xcrun stapler staple <dmg>' を手動で実行してください (submission ID: $SUB_ID)。"
          fi
          echo "::endgroup::"

          echo "::group::Verify"
          xcrun stapler validate "$DMG_PATH" || true
          spctl -a -t open --context context:primary-signature -vvv "$DMG_PATH" || true
          echo "::endgroup::"

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-macos-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Windows (x64) ----------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build (release-windows)
        run: npm run release-windows

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $appDir = Resolve-Path "..\VSCode-win32-x64"
          if (-not (Test-Path "$appDir")) {
            Write-Error "Build output not found at $appDir"
          }
          $tag = "$env:RELEASE_TAG"
          $zipName = "Orchestra-$tag-win32-x64.zip"
          Compress-Archive -Path "$appDir\*" -DestinationPath "artifacts\$zipName" -Force
          Get-ChildItem artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Linux (x64) ----------
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsecret-1-dev \
            libxkbfile-dev \
            libkrb5-dev \
            libx11-dev \
            libxss-dev \
            libgbm-dev \
            libnss3-dev \
            libgtk-3-dev \
            fakeroot \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build (release-linux)
        run: npm run release-linux

      - name: Package tar.gz
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_DIR="$(cd .. && pwd)/VSCode-linux-x64"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: build output not found at $APP_DIR"
            exit 1
          fi
          TAG="${RELEASE_TAG}"
          (cd "$(dirname "$APP_DIR")" && tar -czf "$GITHUB_WORKSPACE/artifacts/Orchestra-$TAG-linux-x64.tar.gz" "$(basename "$APP_DIR")")
          ls -la artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-linux-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Release ----------
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    # 3 OS が全て成功した時だけ実行
    if: ${{ always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la artifacts/
          echo "---- file sizes ----"
          du -h artifacts/* || true

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          echo "Releasing tag: $TAG"
          DRAFT_FLAG=''
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG='--draft'
          fi
          # リリースが既にあればアセットを上書きアップロード、無ければ作成
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets (clobber)…"
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Creating new release $TAG…"
            gh release create "$TAG" \
              --title "Orchestra $TAG" \
              --generate-notes \
              $DRAFT_FLAG \
              artifacts/*
          fi
