name: Release

# タグ ("v*") を push すると 3 OS でビルドし、
# 成果物を GitHub Release にアップロードする。
# 手動トリガーも可能 (workflow_dispatch)。
#
# 注意:
# - macOS arm64 ジョブは macos-14 (Apple Silicon) を使う (gulp vscode-darwin-arm64 が必要)。
# - Windows / Linux は x64 ビルド。arm64 が要るなら matrix を増やす。
# - 全 OS でフルビルドが走るため 1 回 30〜90 分かかる想定。
# - 一部 OS だけ自動化したい場合は不要なジョブを削除/コメントアウトする。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ (例: v1.4.10)。タグが未存在なら作成して push される。'
        required: true
        default: 'v0.0.0-test'
      draft:
        description: 'ドラフトリリースとして作成する'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  ORCHESTRA_REPO: tapiocaTakeshi/Orchestra
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  CHILD_CONCURRENCY: '1'
  # VSCode のフルビルドはデフォルトの 2GB ヒープでは OOM するため広めに確保する。
  # ランナーの RAM (mac-14: 7GB / windows/linux: 16GB) より大きい値は意味がないので 6144 程度で十分。
  NODE_OPTIONS: '--max-old-space-size=6144'
  # push 時は ref_name (= タグ), workflow_dispatch 時は inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  # ---------- macOS (arm64) ----------
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    timeout-minutes: 120
    # @vscode/ripgrep の postinstall が GitHub Releases API を叩いて 403 になるのを回避するため、
    # ジョブ全体に GITHUB_TOKEN を渡しておく。
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Developer ID 署名 + Notarization 用 Secrets。
      # 未登録の場合はジョブ内で ad-hoc 署名にフォールバックする。
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Setup signing keychain
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/buildagent.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # base64 デコードして .p12 を復元
          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          # 一時 keychain を作成して unlock
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 証明書を import
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # 検索パスに追加（既存 keychain も維持）
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          # codesign / electron-osx-sign からの自動アクセスを許可
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # 署名できる identity が見えているか念のため検証
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build (compile + electron package)
        # release-macos は ad-hoc 署名を含むため、CI では分割実行する
        run: |
          set -euo pipefail
          npm run bac
          npm run gulp vscode-darwin-arm64

      - name: Code sign with Developer ID
        if: env.MACOS_CODESIGN_IDENTITY != ''
        env:
          AGENT_BUILDDIRECTORY: ${{ runner.workspace }}
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          VSCODE_ARCH: arm64
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          # VSCode 標準の electron-osx-sign ベース署名スクリプトを使う。
          # hardened runtime + entitlements が自動的に付与される。
          cd build
          node darwin/sign.js "$AGENT_BUILDDIRECTORY"

      - name: Ad-hoc sign (fallback)
        if: env.MACOS_CODESIGN_IDENTITY == ''
        run: |
          echo "::warning::MACOS_CODESIGN_IDENTITY が未設定のため ad-hoc 署名でビルドします。"
          echo "::warning::ダウンロードした .app は『壊れている』と表示されます。"
          npm run sign-macos

      - name: Create DMG and ZIP
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_DIR="$(cd .. && pwd)/VSCode-darwin-arm64"
          if [ ! -d "$APP_DIR/Orchestra.app" ]; then
            echo "ERROR: Orchestra.app not found at $APP_DIR"
            ls -la "$APP_DIR" || true
            exit 1
          fi
          DMG_PATH="artifacts/Orchestra-${RELEASE_TAG}-darwin-arm64.dmg"
          ZIP_PATH="$GITHUB_WORKSPACE/artifacts/Orchestra-${RELEASE_TAG}-darwin-arm64.zip"
          hdiutil create \
            -volname "Orchestra" \
            -srcfolder "$APP_DIR/Orchestra.app" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          (cd "$APP_DIR" && zip -ry "$ZIP_PATH" Orchestra.app)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -la artifacts/

      - name: Sign DMG
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          codesign --force \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_PATH"
          codesign --verify --verbose "$DMG_PATH"

      - name: Notarize and staple DMG
        if: env.MACOS_CODESIGN_IDENTITY != '' && env.MACOS_NOTARIZATION_APPLE_ID != ''
        run: |
          set -euo pipefail
          echo "Submitting $DMG_PATH to Apple notary service..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
            --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
            --password "$MACOS_NOTARIZATION_PASSWORD" \
            --wait
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"
          echo "Verifying..."
          xcrun stapler validate "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -vvv "$DMG_PATH" || true

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-macos-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Windows (x64) ----------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build (release-windows)
        run: npm run release-windows

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $appDir = Resolve-Path "..\VSCode-win32-x64"
          if (-not (Test-Path "$appDir")) {
            Write-Error "Build output not found at $appDir"
          }
          $tag = "$env:RELEASE_TAG"
          $zipName = "Orchestra-$tag-win32-x64.zip"
          Compress-Archive -Path "$appDir\*" -DestinationPath "artifacts\$zipName" -Force
          Get-ChildItem artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Linux (x64) ----------
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsecret-1-dev \
            libxkbfile-dev \
            libkrb5-dev \
            libx11-dev \
            libxss-dev \
            libgbm-dev \
            libnss3-dev \
            libgtk-3-dev \
            fakeroot \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build (release-linux)
        run: npm run release-linux

      - name: Package tar.gz
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_DIR="$(cd .. && pwd)/VSCode-linux-x64"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: build output not found at $APP_DIR"
            exit 1
          fi
          TAG="${RELEASE_TAG}"
          (cd "$(dirname "$APP_DIR")" && tar -czf "$GITHUB_WORKSPACE/artifacts/Orchestra-$TAG-linux-x64.tar.gz" "$(basename "$APP_DIR")")
          ls -la artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-linux-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Release ----------
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    # 3 OS が全て成功した時だけ実行
    if: ${{ always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la artifacts/
          echo "---- file sizes ----"
          du -h artifacts/* || true

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          echo "Releasing tag: $TAG"
          DRAFT_FLAG=''
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG='--draft'
          fi
          # リリースが既にあればアセットを上書きアップロード、無ければ作成
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets (clobber)…"
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Creating new release $TAG…"
            gh release create "$TAG" \
              --title "Orchestra $TAG" \
              --generate-notes \
              $DRAFT_FLAG \
              artifacts/*
          fi
