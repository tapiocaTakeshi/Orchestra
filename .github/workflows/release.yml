name: Release

# タグ ("v*") を push すると 3 OS でビルドし、
# 成果物を GitHub Release にアップロードする。
# 手動トリガーも可能 (workflow_dispatch)。
#
# 注意:
# - macOS arm64 ジョブは macos-14 (Apple Silicon) を使う (gulp vscode-darwin-arm64 が必要)。
# - Windows / Linux は x64 ビルド。arm64 が要るなら matrix を増やす。
# - 全 OS でフルビルドが走るため 1 回 30〜90 分かかる想定。
# - 一部 OS だけ自動化したい場合は不要なジョブを削除/コメントアウトする。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースタグ (例: v1.4.10)。タグが未存在なら作成して push される。'
        required: true
        default: 'v0.0.0-test'
      draft:
        description: 'ドラフトリリースとして作成する'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  ORCHESTRA_REPO: tapiocaTakeshi/Orchestra
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  CHILD_CONCURRENCY: '1'
  # VSCode のフルビルドはデフォルトの 2GB ヒープでは OOM するため広めに確保する。
  # ランナーの RAM (mac-14: 7GB / windows/linux: 16GB) より大きい値は意味がないので 6144 程度で十分。
  NODE_OPTIONS: '--max-old-space-size=6144'
  # push 時は ref_name (= タグ), workflow_dispatch 時は inputs.tag
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  # ---------- macOS (arm64) ----------
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-14
    timeout-minutes: 120
    # @vscode/ripgrep の postinstall が GitHub Releases API を叩いて 403 になるのを回避するため、
    # ジョブ全体に GITHUB_TOKEN を渡しておく。
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Developer ID 署名 + Notarization 用 Secrets。
      # 未登録の場合はジョブ内で ad-hoc 署名にフォールバックする。
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # @vscode/ripgrep の postinstall が GitHub Releases のアセットダウンロードで
        # 一時的な 5xx を返すことがあるため、npm ci 全体をリトライする。
        # npm ci は毎回 node_modules を作り直すのでリトライは安全。
        run: |
          set -euo pipefail
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "npm ci failed after $max_attempts attempts" >&2
              exit 1
            fi
            wait=$((attempt * 15))
            echo "npm ci failed (attempt $attempt/$max_attempts); retrying in ${wait}s..."
            sleep "$wait"
          done

      - name: Setup signing keychain
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/buildagent.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          # base64 デコード。Secret に改行や余計な空白が混じると base64 が壊れるので
          # printf + tr で確実に削ぎ落としてからデコードする。
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" \
            | tr -d ' \t\r\n' \
            | base64 --decode > "$CERT_PATH"

          # ファイル形式の健全性チェック（PKCS12 = ASN.1 SEQUENCE で 0x30 0x82 から始まる）
          echo "::group::Decoded p12 inspection"
          ls -la "$CERT_PATH"
          file "$CERT_PATH" || true
          # 先頭 4 バイトを 16 進ダンプして PKCS12 マジックを確認
          xxd -l 4 "$CERT_PATH" || true
          if [ ! -s "$CERT_PATH" ]; then
            echo "ERROR: Decoded p12 is empty. MACOS_CERTIFICATE_P12_BASE64 が空 or 不正な可能性があります。"
            exit 1
          fi
          MAGIC=$(xxd -p -l 2 "$CERT_PATH" || true)
          if [ "$MAGIC" != "3082" ]; then
            echo "ERROR: Decoded file does not look like a PKCS12 (.p12)."
            echo "       Magic bytes were 0x$MAGIC (expected 0x3082)."
            echo "       'security import' でエクスポートしたか、改行混入が無いか確認してください。"
            exit 1
          fi
          echo "::endgroup::"

          # 一時 keychain を作成して unlock
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 証明書を import (-f pkcs12 を明示せず auto-detect させる方が安定)
          security import "$CERT_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -k "$KEYCHAIN_PATH"

          # 検索パスに追加（既存 keychain も維持）
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          # codesign / electron-osx-sign からの自動アクセスを許可
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # 署名できる identity が見えているか念のため検証
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build (compile + electron package)
        # release-macos は ad-hoc 署名を含むため、CI では分割実行する
        run: |
          set -euo pipefail
          npm run bac
          npm run gulp vscode-darwin-arm64

      - name: Strip AppleDouble sidecar files before signing
        # ソース/依存パッケージに ._foo (AppleDouble リソースフォーク) が
        # 混入していると codesign --deep がそれをシール対象に含めてしまう。
        # しかし後段の DMG ステージングで使う ditto はコピー時に AppleDouble
        # を正規化・除去するため、シール後の内容と DMG に入る実体がズレて
        # 「a sealed resource is missing or invalid」で notarization 前の
        # 検証が失敗する。署名前にビルド出力から確実に除去しておく。
        run: |
          set -euo pipefail
          APP_DIR="$(cd .. && pwd)/VSCode-darwin-arm64"
          find "$APP_DIR" -name '._*' -print -delete

      - name: Code sign with Developer ID
        if: env.MACOS_CODESIGN_IDENTITY != ''
        env:
          # build/darwin/sign.js が参照する環境変数
          AGENT_TEMPDIRECTORY: ${{ runner.temp }}
          VSCODE_ARCH: arm64
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          DEBUG: electron-osx-sign*
        run: |
          set -euo pipefail
          APP_DIR="$(cd .. && pwd)/VSCode-darwin-arm64"
          APP="$APP_DIR/Orchestra.app"

          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found"
            ls -la "$APP_DIR" || true
            exit 1
          fi

          # 拡張属性 (quarantine 等) を全部クリア。これがあると Notary 検証で
          # 「signature is invalid」になることがある。
          xattr -cr "$APP"

          # build/darwin/sign.js は引数として "buildDir" (= VSCode-darwin-<arch>
          # の親ディレクトリ) を受け取る。Microsoft の Azure CI と同じ呼び方。
          BUILD_DIR="$(cd .. && pwd)"

          # sign.js は keychain 名を AGENT_TEMPDIRECTORY/buildagent.keychain で
          # 探す。本ワークフローも同じパスで作っているため上の env だけで OK。
          ls -la "$AGENT_TEMPDIRECTORY/buildagent.keychain" || true

          echo "::group::Run Microsoft VS Code sign.js (electron-osx-sign)"
          node build/darwin/sign.js "$BUILD_DIR"
          echo "::endgroup::"

          echo "::group::Diagnose Electron binary signature"
          codesign -d -v --verbose=4 "$APP/Contents/MacOS/Electron" 2>&1 || true
          echo "---"
          codesign --display --entitlements - "$APP/Contents/MacOS/Electron" 2>&1 || true
          echo "::endgroup::"

          echo "::group::Verify"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -t exec -vvv "$APP" || true
          echo "::endgroup::"

      - name: Ad-hoc sign (fallback)
        if: env.MACOS_CODESIGN_IDENTITY == ''
        run: |
          echo "::warning::MACOS_CODESIGN_IDENTITY が未設定のため ad-hoc 署名でビルドします。"
          echo "::warning::ダウンロードした .app は『壊れている』と表示されます。"
          npm run sign-macos

      - name: Create DMG and ZIP
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_DIR="$(cd .. && pwd)/VSCode-darwin-arm64"
          if [ ! -d "$APP_DIR/Orchestra.app" ]; then
            echo "ERROR: Orchestra.app not found at $APP_DIR"
            ls -la "$APP_DIR" || true
            exit 1
          fi

          # hdiutil に署名済みのビルド出力ディレクトリを直接読ませると、
          # electron-packager がヘルパー実行ファイルをハードリンクで共有している
          # 場合などに、DMG/ZIP に取り込まれるコピーがコード署名と食い違う
          # ("The signature of the binary is invalid" が notarization でのみ
          # 再現する) ことがある。ditto (Apple 推奨のバンドルコピー手段) で
          # 独立したステージングコピーを作成し、パッケージ化はそちらから行う。
          STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          ditto "$APP_DIR/Orchestra.app" "$STAGE_DIR/Orchestra.app"

          DMG_PATH="artifacts/Orchestra-${RELEASE_TAG}-darwin-arm64.dmg"
          ZIP_PATH="$GITHUB_WORKSPACE/artifacts/Orchestra-${RELEASE_TAG}-darwin-arm64.zip"
          hdiutil create \
            -volname "Orchestra" \
            -srcfolder "$STAGE_DIR/Orchestra.app" \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          (cd "$STAGE_DIR" && zip -ry "$ZIP_PATH" Orchestra.app)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -la artifacts/

      - name: Sign DMG
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          codesign --force \
            --sign "$MACOS_CODESIGN_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            "$DMG_PATH"
          codesign --verify --verbose "$DMG_PATH"

      - name: Verify signature inside the packaged DMG
        if: env.MACOS_CODESIGN_IDENTITY != ''
        run: |
          set -euo pipefail
          # ローカルの $APP に対する codesign --verify は毎回 valid になるが、
          # notarization は DMG の中身 (= 実際にアップロードされるバイト列) を
          # 検証する。ここで「まさに提出する DMG の中の .app」をマウントして
          # 同じ検証を通しておけば、hdiutil/zip のパッケージングでコード署名が
          # 壊れているケースを Apple に送る前に検知できる。
          MOUNT_POINT="$RUNNER_TEMP/dmg-verify-mount"
          mkdir -p "$MOUNT_POINT"
          echo "::group::Mount DMG read-only"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -readonly -noautoopen -nobrowse
          echo "::endgroup::"

          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet || true
          }
          trap cleanup EXIT

          MOUNTED_APP="$MOUNT_POINT/Orchestra.app"
          echo "::group::codesign -dvvv on the mounted Electron binary"
          codesign -dvvv "$MOUNTED_APP/Contents/MacOS/Electron" 2>&1 || true
          echo "::endgroup::"

          echo "::group::codesign --verify --deep --strict on the mounted app"
          codesign --verify --deep --strict --verbose=4 "$MOUNTED_APP"
          echo "::endgroup::"

          echo "::group::spctl assessment on the mounted app"
          spctl -a -t exec -vvv "$MOUNTED_APP" || true
          echo "::endgroup::"

      - name: Notarize and staple DMG
        if: env.MACOS_CODESIGN_IDENTITY != '' && env.MACOS_NOTARIZATION_APPLE_ID != ''
        run: |
          set -euo pipefail
          echo "::group::Submit to Apple notary service"
          SUBMIT_OUT=$(mktemp)
          if ! xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
              --password "$MACOS_NOTARIZATION_PASSWORD" \
              --wait \
              --output-format json \
              | tee "$SUBMIT_OUT"; then
            echo "::error::notarytool submit failed."
            exit 1
          fi
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status',''))" "$SUBMIT_OUT")
          SUB_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('id',''))" "$SUBMIT_OUT")
          echo "Submission ID: $SUB_ID"
          echo "Status:        $STATUS"
          echo "::endgroup::"

          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::notarytool log (submission $SUB_ID)"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$MACOS_NOTARIZATION_APPLE_ID" \
              --team-id "$MACOS_NOTARIZATION_TEAM_ID" \
              --password "$MACOS_NOTARIZATION_PASSWORD" || true
            echo "::endgroup::"
            echo "::error::Notarization rejected (status=$STATUS). 上のログで原因を確認してください。"
            exit 1
          fi

          echo "::group::Staple notarization ticket (with retry)"
          # CloudKit 伝播ラグで最初の数十秒〜数分はチケットが取れず Error 65 になることがある。
          # 6 回 × 30 秒 = 最大 3 分リトライする。
          STAPLED=0
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$DMG_PATH"; then
              echo "Stapling succeeded on attempt $attempt."
              STAPLED=1
              break
            fi
            echo "Stapling attempt $attempt failed (CloudKit propagation lag); retry in 30s..."
            sleep 30
          done

          if [ "$STAPLED" -ne 1 ]; then
            echo "::warning::Stapling failed after retries. DMG はオンライン Notarization 済みなので動作はしますが,"
            echo "::warning::オフライン起動時に Gatekeeper の確認ダイアログが出る可能性があります。"
            echo "::warning::必要なら後で 'xcrun stapler staple <dmg>' を手動で実行してください (submission ID: $SUB_ID)。"
          fi
          echo "::endgroup::"

          echo "::group::Verify"
          xcrun stapler validate "$DMG_PATH" || true
          spctl -a -t open --context context:primary-signature -vvv "$DMG_PATH" || true
          echo "::endgroup::"

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-macos-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Windows (x64) ----------
  build-windows:
    name: Build Windows (x64)
    # windows-latest は 2026-06 に Windows Server 2025 + Visual Studio 2026 (VS "18") へ
    # 移行済み。本プロジェクトが使う @electron/node-gyp@10.2.0-electron.1 はまだ VS 2026 を
    # 認識できず、node-gyp によるネイティブモジュールのビルド (@vscode/policy-watcher 等) が
    # "Could not find any Visual Studio installation to use" で失敗する。
    # node-gyp が VS 2026 に対応するまでは VS 2022 系イメージに固定する。
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Authenticode 署名用 Secrets。未登録の場合は署名なし (unsigned) でビルドする。
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # @vscode/ripgrep の postinstall が GitHub Releases のアセットダウンロードで
        # 一時的な 5xx を返すことがあるため、npm ci 全体をリトライする。
        # npm ci は毎回 node_modules を作り直すのでリトライは安全。
        shell: pwsh
        run: |
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            npm ci
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq $maxAttempts) {
              Write-Error "npm ci failed after $maxAttempts attempts"
              exit 1
            }
            $wait = $attempt * 15
            Write-Host "npm ci failed (attempt $attempt/$maxAttempts); retrying in ${wait}s..."
            Start-Sleep -Seconds $wait
          }

      - name: Build (release-windows)
        run: npm run release-windows

      - name: Setup signing certificate
        if: env.WINDOWS_CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'

          # base64 デコード。Secret に改行や余計な空白が混じると壊れるので除去してからデコードする。
          $b64 = $env:WINDOWS_CODESIGN_PFX_BASE64 -replace '\s', ''
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($b64))

          if ((Get-Item $certPath).Length -eq 0) {
            Write-Error "Decoded pfx is empty. WINDOWS_CODESIGN_PFX_BASE64 が空 or 不正な可能性があります。"
          }

          # PFX (PKCS#12) は ASN.1 SEQUENCE (0x30 0x82) から始まる。マジックバイトで健全性を確認する。
          $bytes = [IO.File]::ReadAllBytes($certPath)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x30 -or $bytes[1] -ne 0x82) {
            Write-Error "Decoded file does not look like a PKCS12 (.pfx). 'certutil -encode' 等でエクスポートし直してください。"
          }

          echo "CODESIGN_PFX_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Code sign executable with Authenticode
        if: env.WINDOWS_CODESIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            Write-Error "signtool.exe not found under Windows Kits."
          }

          $exePath = Resolve-Path "..\VSCode-win32-x64\Orchestra.exe"

          & $signtool sign `
            /f "$env:CODESIGN_PFX_PATH" `
            /p "$env:WINDOWS_CODESIGN_PASSWORD" `
            /fd sha256 `
            /tr http://timestamp.digicert.com `
            /td sha256 `
            "$exePath"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool sign failed (exit code $LASTEXITCODE)"
          }

          & $signtool verify /pa /v "$exePath"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool verify failed (exit code $LASTEXITCODE)"
          }

      - name: Cleanup signing certificate
        if: always() && env.CODESIGN_PFX_PATH != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:CODESIGN_PFX_PATH"

      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $appDir = Resolve-Path "..\VSCode-win32-x64"
          if (-not (Test-Path "$appDir")) {
            Write-Error "Build output not found at $appDir"
          }
          $tag = "$env:RELEASE_TAG"
          $zipName = "Orchestra-$tag-win32-x64.zip"
          Compress-Archive -Path "$appDir\*" -DestinationPath "artifacts\$zipName" -Force
          Get-ChildItem artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-windows-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Linux (x64) ----------
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsecret-1-dev \
            libxkbfile-dev \
            libkrb5-dev \
            libx11-dev \
            libxss-dev \
            libgbm-dev \
            libnss3-dev \
            libgtk-3-dev \
            fakeroot \
            rpm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # @vscode/ripgrep の postinstall が GitHub Releases のアセットダウンロードで
        # 一時的な 5xx を返すことがあるため、npm ci 全体をリトライする。
        # npm ci は毎回 node_modules を作り直すのでリトライは安全。
        run: |
          set -euo pipefail
          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "npm ci failed after $max_attempts attempts" >&2
              exit 1
            fi
            wait=$((attempt * 15))
            echo "npm ci failed (attempt $attempt/$max_attempts); retrying in ${wait}s..."
            sleep "$wait"
          done

      - name: Build (release-linux)
        run: npm run release-linux

      - name: Package tar.gz
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APP_DIR="$(cd .. && pwd)/VSCode-linux-x64"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: build output not found at $APP_DIR"
            exit 1
          fi
          TAG="${RELEASE_TAG}"
          (cd "$(dirname "$APP_DIR")" && tar -czf "$GITHUB_WORKSPACE/artifacts/Orchestra-$TAG-linux-x64.tar.gz" "$(basename "$APP_DIR")")
          ls -la artifacts/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orchestra-linux-x64
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ---------- Release ----------
  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    # 3 OS が全て成功した時だけ実行
    if: ${{ always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la artifacts/
          echo "---- file sizes ----"
          du -h artifacts/* || true

      - name: Generate SHA256SUMS.txt
        # Orchestra 本体の自動アップデート機能 (VoidMainUpdateService) がダウンロード後に
        # この一覧を使って整合性検証を行う。sha256sum 互換フォーマット ("<hex>  <filename>")。
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          echo "Releasing tag: $TAG"
          DRAFT_FLAG=''
          if [ "${{ inputs.draft }}" = "true" ]; then
            DRAFT_FLAG='--draft'
          fi
          # リリースが既にあればアセットを上書きアップロード、無ければ作成
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets (clobber)…"
            gh release upload "$TAG" artifacts/* --clobber
          else
            echo "Creating new release $TAG…"
            gh release create "$TAG" \
              --title "Orchestra $TAG" \
              --generate-notes \
              $DRAFT_FLAG \
              artifacts/*
          fi
